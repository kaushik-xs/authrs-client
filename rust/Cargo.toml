[package]
name = "authrs-client"
# Kept in lockstep with typescript/package.json — the release workflow bumps both.
version = "0.0.19"
edition = "2024"
description = "Typed async Rust client for the Authrs multi-tenant authentication service"
authors = ["Kaushik Sundar"]
license = "MIT"
repository = "https://github.com/kaushik-xs/authrs-client"
readme = "README.md"
keywords = ["authrs", "auth", "authentication", "multi-tenant", "client"]
categories = ["authentication", "api-bindings", "web-programming::http-client"]

[features]
default = ["rustls"]
# TLS backend for reqwest. Disable default features to pick `native-tls` instead.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
urlencoding = "2.1.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
