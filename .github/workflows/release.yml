name: Release

# Push a tag `vX.Y.Z` to release. The version is taken from the tag and stamped into
# typescript/package.json and rust/Cargo.toml at publish time, so the TypeScript SDK (npm) and
# the Rust SDK (crates.io) always ship as exactly `X.Y.Z`. A GitHub release is created for the tag.
#
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    name: Resolve version
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Version from tag
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z (optionally vX.Y.Z-pre)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish to npm
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@kaushik91"

      - run: npm ci

      - name: Set version from tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build
      - run: npm run typecheck

      - name: Publish
        run: |
          if npm view "@kaushik91/authrs-client@${VERSION}" version >/dev/null 2>&1; then
            echo "@kaushik91/authrs-client@${VERSION} is already on npm — skipping"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        run: |
          # First `version = ` line only — that's [package]; dependency versions are inline tables.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo update --workspace

      - name: Publish
        run: |
          if curl -sf -A "authrs-client-release (https://github.com/kaushik-xs/authrs-client)" \
              "https://crates.io/api/v1/crates/authrs-client/${VERSION}" >/dev/null; then
            echo "authrs-client ${VERSION} is already on crates.io — skipping"
          else
            # --allow-dirty: Cargo.toml/Cargo.lock were just stamped with the tag version.
            cargo publish --locked --allow-dirty
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    needs: [version, publish-npm, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
